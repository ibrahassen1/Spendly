name: Release checks
on:
  push:
    branches:
      - feature/spendly-ui-upgrade
      - main
      - test/v11-release-safety
  pull_request:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Reconcile the existing stale Clerk lock entries during the release build.
      # Commit an updated package-lock.json before switching this back to npm ci.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_SPENDLY_API_URL: https://example.invalid

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spendly
          POSTGRES_PASSWORD: spendly_dev
          POSTGRES_DB: spendly
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spendly -d spendly"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      GOOGLE_REDIRECT_URI: http://localhost:8080/api/account/gmail/callback
      SPENDLY_AUTH_ISSUER_URI: https://example.invalid
      SPENDLY_GMAIL_TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: chmod +x ./mvnw
      - run: ./mvnw --batch-mode test
