name: Rebuild build and tests
on:
  push:
    branches: [feature/safe-to-spend-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spendly
          POSTGRES_USER: spendly
          POSTGRES_PASSWORD: spendly_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U spendly -d spendly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test Spring Boot
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/spendly
          SPRING_DATASOURCE_USERNAME: spendly
          SPRING_DATASOURCE_PASSWORD: spendly_test
          SPENDLY_AUTH_ISSUER_URI: https://example.invalid
        run: mvn -B clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build React app
        run: npm run build
      - name: Lint React app
        run: npm run lint
