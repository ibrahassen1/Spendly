spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/spendly}
    username: ${SPRING_DATASOURCE_USERNAME:spendly}
    password: ${SPRING_DATASOURCE_PASSWORD:spendly_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: ${PORT:8080}

google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/account/gmail/callback}

spendly:
  auth:
    issuer-uri: ${SPENDLY_AUTH_ISSUER_URI}
  gmail:
    token-encryption-key: ${SPENDLY_GMAIL_TOKEN_ENCRYPTION_KEY}
